# ========================
# 服务端口配置
# ========================
server.port=8080

# ========================
# gRPC 服务器配置
# ========================
grpc.server.port=9090
grpc.server.max-inbound-message-size=104857600
grpc.server.enabled=true

# ========================
# 数据库配置 (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/dinky?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MybatisPlus 配置
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.dlink.model
mybatis-plus.configuration.map-underscore-to-camel-name=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ========================
# Redis 配置 (分布式会话)
# ========================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=5000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# ========================
# 日志配置
# ========================
logging.level.root=INFO
logging.level.com.dlink.grpc=DEBUG
logging.level.com.dlink.job=DEBUG
logging.level.io.grpc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
logging.file.name=/var/log/dinky-grpc/dlink-grpc-service.log
logging.file.max-size=100MB
logging.file.max-history=30

# ========================
# Actuator 监控配置
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=dinky-grpc-service

# ========================
# Flink 配置
# ========================
# Flink RestAPI 超时时间 (毫秒)
flink.rest.timeout=30000
# Flink 任务查询间隔 (毫秒)
flink.status.query.interval=5000

# ========================
# 会话配置
# ========================
# 分布式会话过期时间 (秒)
session.timeout=1800
# 会话清理间隔 (秒)
session.cleanup.interval=300

# ========================
# 安全配置
# ========================
# Token 加密密钥 (生产环境请修改)
security.token.secret=dinky-grpc-secret-key-2024
# Token 过期时间 (小时)
security.token.expire-hours=24
