
name: test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo mkdir -p /mnt/lib/docker
          chmod -R 777 /mnt/lib/docker
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
             "data-root": "/mnt/lib/docker"
            }
      - run: |
          df -h
          docker info | grep Dir
