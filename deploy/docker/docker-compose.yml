version: "3.9"

services:
  dinky:
    image: "dinkydocker/dinky-standalone-server:${DINKY_VERSION}-flink${FLINK_VERSION}"
    ports:
      - "8888:8888"
    # JVM_OPTS is not listed here on purpose: an empty value would override the
    # image default (container RAM percentage). Set it via `docker run -e` or
    # add it only to this service when you need a custom heap.
    env_file: .env
    networks:
      - dinky
    volumes:
      - ${CUSTOM_JAR_PATH}:/opt/dinky/customJar/

  jobmanager:
    image: flink:${FLINK_VERSION}-scala_2.12-java8
    ports:
      - "8081:8081"
    command: jobmanager
    env_file: .env
    volumes:
      - ${CUSTOM_JAR_PATH}:/opt/flink/lib/customJar/
    networks:
      - dinky

  taskmanager:
    image: flink:${FLINK_VERSION}-scala_2.12-java8
    command: taskmanager
    env_file: .env
    volumes:
      - ${CUSTOM_JAR_PATH}:/opt/flink/lib/customJar/
    networks:
      - dinky

networks:
  dinky:
